services:
  app:
    build:
      context: .
      target: runner            # multi-stage: фінальний production-образ
    image: lab10-app:prod
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      ADMIN_API_KEY: supersecret123
      ALLOWED_ORIGIN: http://localhost:3000
      EXTERNAL_API_URL: http://localhost:3001
      MYSQL_HOST: mysql         # ← ім'я сервісу = hostname у мережі compose
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_DB: lab10
      REDIS_HOST: redis         # ← ім'я сервісу
      REDIS_PORT: 6379
      JWT_SECRET: prod-jwt-secret-min-32-chars-long-secret
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: lab10
    volumes:
      - mysql_data:/var/lib/mysql
      - ./drizzle:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=TCP", "-uroot", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  mysql_data:
  redis_data:
